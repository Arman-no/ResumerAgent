<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ResumerAgent</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>ResumerAgent</h1>
    <div class="topbar-actions">
      <span id="last-refreshed" class="muted"></span>
      <button id="refresh-btn" class="icon-btn" title="Refresh now">⟳</button>
      <button id="shutdown-btn" class="icon-btn icon-btn-danger" title="Shut down ResumerAgent">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v8" />
          <path d="M6.5 6.5a7 7 0 1 0 11 0" />
        </svg>
      </button>
    </div>
  </header>

  <main id="content">
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">No sessions found yet.</div>
    <div id="error" class="error-banner hidden">
      <span>Couldn't load sessions.</span>
      <button id="retry-btn">Retry</button>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
