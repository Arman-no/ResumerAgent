<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ResumerAgent</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('resumeragent-theme') || 'dark';</script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="heartbeat" id="heartbeat" title="Live — polls every 5s"></span>
      <h1>ResumerAgent</h1>
    </div>
    <div class="topbar-actions">
      <span id="last-refreshed" class="muted"></span>
      <button id="theme-toggle-btn" class="icon-btn" title="Switch to light theme">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      </button>
      <button id="refresh-btn" class="icon-btn" title="Refresh now">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
      <button id="shutdown-btn" class="icon-btn icon-btn-danger" title="Shut down ResumerAgent">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v8" />
          <path d="M6.5 6.5a7 7 0 1 0 11 0" />
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="filters" id="filters">
      <div class="filter-group">
        <label class="filter-label" for="filter-search">Search</label>
        <input id="filter-search" class="filter-search" type="search" placeholder="Name or folder…" autocomplete="off" />
      </div>

      <fieldset class="filter-group">
        <legend class="filter-label">When</legend>
        <div class="chip-row" id="filter-when" role="radiogroup" aria-label="When">
          <button class="chip" type="button" role="radio" aria-checked="false" data-when="today">Today</button>
          <button class="chip" type="button" role="radio" aria-checked="false" data-when="week">This week</button>
          <button class="chip active" type="button" role="radio" aria-checked="true" data-when="all">All</button>
        </div>
      </fieldset>

      <fieldset class="filter-group">
        <legend class="filter-label">Status</legend>
        <label class="filter-check filter-check-all">
          <input type="checkbox" id="status-all" checked />
          <span>All</span>
        </label>
        <label class="filter-check">
          <input type="checkbox" data-status="live" checked />
          <span class="pill status-idle" style="pointer-events:none">live</span>
        </label>
        <label class="filter-check">
          <input type="checkbox" data-status="resumable" checked />
          <span class="pill status-resumable" style="pointer-events:none">resumable</span>
        </label>
        <label class="filter-check">
          <input type="checkbox" data-status="unknown" checked />
          <span class="pill status-resumable" style="pointer-events:none">status unknown</span>
        </label>
        <label class="filter-check">
          <input type="checkbox" data-status="superseded" checked />
          <span class="pill status-superseded" style="pointer-events:none">retired</span>
        </label>
      </fieldset>

      <button id="clear-filters-btn" class="link-btn" type="button">Clear filters</button>
    </aside>

    <main id="content">
      <div id="live-status-banner" class="live-status-banner hidden" role="status"></div>
      <section class="stat-cards" id="stat-cards" aria-label="Session statistics"></section>
      <div class="list-toolbar">
        <span id="result-count" class="muted" aria-live="polite"></span>
        <label class="sort-control muted">
          Sort:
          <select id="sort-select">
            <option value="createdAt-desc">Newest created</option>
            <option value="createdAt-asc">Oldest created</option>
            <option value="updatedAt-desc">Recently active</option>
            <option value="name-asc">Name (A–Z)</option>
          </select>
        </label>
      </div>
      <div id="session-list" class="session-list"></div>
      <div id="empty" class="empty hidden">No sessions found yet.</div>
      <div id="no-matches" class="empty hidden" aria-live="polite">
        No sessions match these filters.
        <button id="clear-filters-inline-btn" class="link-btn" type="button">Clear filters</button>
      </div>
      <div id="error" class="error-banner hidden">
        <span>Couldn't load sessions.</span>
        <button id="retry-btn">Retry</button>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
